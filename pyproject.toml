[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rap-lm"
version = "0.1.0"
description = "RAP-LM: read API and batch pipeline for pedestrian-collision risk analysis in Lima."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.2,<4",
  "pyproj>=3.7,<4.0",
  "shapely>=2.0,<3.0",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
pipeline = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "osmium>=4,<5",
  "rasterio>=1.4,<2",
  "torch>=2.5",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "."]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
